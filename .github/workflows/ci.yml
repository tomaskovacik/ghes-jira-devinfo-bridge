name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.5.9"
          python-version: "3.12"
      # --frozen: install exactly what uv.lock pins. --no-build: wheels only,
      # never execute a package's setup script. --no-install-project: only
      # third-party deps go in the venv; the local package is picked up from
      # src/ via pytest's pythonpath, so --no-build never has to build it.
      - run: uv sync --frozen --no-install-project --no-build --extra dev
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pytest

  docker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t ghes-jira-devinfo-bridge:ci .
