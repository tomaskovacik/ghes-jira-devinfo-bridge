name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.5.9"
          python-version: "3.12"
      # --frozen: install exactly what uv.lock pins; --no-build: wheels only,
      # never execute a dependency's setup script. Tools are then run straight
      # from the synced venv so no further resolution happens.
      - run: uv sync --frozen --no-build --extra dev
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pytest

  docker:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t ghes-jira-devinfo-bridge:ci .
