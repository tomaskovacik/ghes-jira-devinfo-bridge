name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes --notes "$(cat <<EOF
          Multi-arch container image (linux/amd64, linux/arm64):

          \`\`\`
          docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          \`\`\`

          Configure via environment (\`.env.example\`), then:

          \`\`\`
          docker run --rm --env-file .env -v \$PWD/data:/data \\
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          \`\`\`

          Subcommands: \`sync\` (default), \`inspect\`, \`delete-repo\` — see the README.
          EOF
          )"
