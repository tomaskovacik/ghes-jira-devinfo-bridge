# "version" is ignored by Compose v2 but required by the older Python docker-compose v1.
version: "3.8"

services:
  bridge:
    image: ghcr.io/tomaskovacik/ghes-jira-devinfo-bridge:0.0.3
    # To build locally instead, comment the image line above and uncomment:
    # build: .
    env_file: .env
    volumes:
      # Named volume: inherits the image's /data ownership (uid 10001), works out of the box.
      - bridge-data:/data
      # To use a host directory instead, replace the line above with:
      #   - ./data:/data
      # and make it writable by the container user: `chown 10001 ./data`
    restart: unless-stopped

volumes:
  bridge-data:
